<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Grid.css">
</head>
<body>
    <!-- GRID
    Grid adalah sistem layout (tata letak) dalam css yang digunakan untuk menyusun elemen-elemen
    di dalam sebuah container ke dalam baris (rows) dan kolom (columns) secara 2 dimensi.
    
    Grid mirip seperti tabel Excel, berguna untuk menyusun elemen dalam bentuk
    kotak-kotak yang terstruktur.

    - Property penting di Grid:
    1. display: grid            > Mengaktifkan grid (WAJIB DIPAKAI)
    2. grid-template-columns    > Mengatur jumlah & ukuran kolom
    3. grid-template-rows       > Mengatur jumlah baris
    4. gap                      > Mengatur serta memberi jarak antar item
    5. grid-column              > Mengatur lebar item
    6. grid-row                 > Mengatur tinggi item
    -->

    <div id="Container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
    </div>

    <div id="Wrapper">
        <div>   1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
    </div>
</body>
</html>
