<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Position.css">
</head>
<body>
    <!-- 
    RELATIVE
    Elemen tetap berada pada alur normal dokumen
    tetapi bisa digeser relatif (fleksibel) terhadap posisi aslinya.

    KARAKTERISTIK RELATIVE:
    1. Masih mempertahankan ruang aslinya (tempat aslinya ke-block dan tidak bisa diisi apa-apa)
    2. Bisa menggunakan top, bottom, left, right
    3. Sering dijadikan referensi parent untuk position absolute
    4. Bisa timpa-timpaan dengan elemen lain
    -->

    <div id="Container">
        <div>Box 1</div>
        <div>Box 2</div>
        <div>Box 3</div>
    </div>

    <!-- 
    ABSOLUTE
    Elemen keluar dari posisi normal
    diposisikan relative terhadap parent(pembungkus) terdekat
    yang memilki position static.

    KARAKTERISTIK ABSOLUTE:
    1. Tidak mempertahankan ruang aslinya (keluar dari normal flow)
    2. Bisa dikontrol penuh dengan top, bottom, left, right
    3. Jika tidak ada parent ber-position non-static -> relatif ke <body>
    -->

    <div id="Wrapper">
        <div>Box 1</div>
        <div>Box 2</div>
        <div>Box 3</div>
    </div>

    <!-- 
    FIXED
    Elemen diposisikan relatif terhadap viewport (layar browser)

    KARAKTERISTIK FIXED:
    1. Tidak tidak terpengaruh scrolling
    2. Selalu berada di posisi yang sama di layar
    3. keluar dari normal flow
    -->

    <nav id="Navbar">

    </nav>
</body>
</html>
